{{ define "main" }}
<!-- Hero Section -->
<section class="hero-section">
    <div class="container">
        <div class="hero-content">
            <img src="images/logo.png" style="max-width: 50%; max-height: 50vh; width: auto; height: auto;"/><br/>
            <h1 class="text-gradient-gold">{{ .Title }}</h1>
            {{ with .Params.subtitle }}
            <h2>{{ . }}</h2>
            {{ end }}
            <div style="margin-top: var(--spacing-md);">
                <a href="#book-demo" class="btn btn-primary">Book a Demo</a>
                <a href="#content" class="btn btn-outline" style="margin-left: 1rem;">Learn More</a>
            </div>
        </div>
    </div>
</section>

<!-- Content from content/_index.md -->
<div class="page-content section" id="content">
    <div class="container">
        <div class="content-wrapper">
            {{ .Content }}
        </div>
    </div>
</div>

<!-- Demo Form Section -->
<section id="book-demo" class="section" style="background: rgba(0,0,0,0.2);">
    <div class="container">
        <div class="text-center" style="margin-bottom: var(--spacing-md);">
            <h2 class="text-gradient-gold">Experience the Future of Identity</h2>
            <p class="text-muted">Fill out the form below and we'll be in touch to schedule a live demo of the Ammit
                Wallet.</p>
        </div>

        <div class="card form-card">
            <form action="mailto:contact@ammit.org" method="POST" enctype="text/plain">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" name="name" required placeholder="Jane Doe">
                </div>
                <div class="form-group">
                    <label class="form-label">Work Email</label>
                    <input type="email" class="form-control" name="email" required placeholder="jane@company.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Company</label>
                    <input type="text" class="form-control" name="company" placeholder="Acme Corp">
                </div>
                <div class="form-group">
                    <label class="form-label">How can we help?</label>
                    <textarea class="form-control" name="message"
                        placeholder="Tell us about your identity/security challenges..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary"
                    style="width: 100%; margin-top: var(--spacing-sm);">Request Demo</button>
            </form>
        </div>
    </div>
</section>
{{ end }}
